name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-v1.1.1
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       contains(github.event.head_commit.message, '[release-v1.1.1]'))
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: x64
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install --index-url https://pypi.org/simple -r requirements-dev.txt
      - name: Check release version
        run: python -c "from nms_scanner import __version__; assert __version__ == '1.1.1'"
      - name: Static checks
        run: python -m ruff check nms_scanner native tests tools
      - name: Non-game tests
        run: python -X utf8 -m unittest discover -s tests -v
      - name: Compile check
        run: python -m compileall -q nms_scanner native tools
      - name: Build portable package
        run: python -X utf8 tools/build_release.py
      - name: Verify portable package
        run: python -X utf8 tools/verify_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: portable-v1.1.1
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: portable-v1.1.1
          path: dist
      - name: Publish v1.1.1 with portable assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v1.1.1 >/dev/null 2>&1; then
            echo 'Release v1.1.1 already exists; refusing to replace it.'
            exit 1
          fi
          (cd dist && sha256sum --check *.sha256)
          gh release create v1.1.1 dist/*.zip dist/*.sha256 \
            --target "$GITHUB_SHA" --draft \
            --title 'v1.1.1 — 星系筛选正式版' \
            --notes-file releases/v1.1.1.md
          gh release edit v1.1.1 --draft=false --prerelease=false --latest
